name: Unified local Quantum Lab
on:
  push:
    branches: [feat/unified-quantum-lab-20261105]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unified-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints-ci.txt -e ".[dev]"
      - run: python -m compileall -q src tests scripts
      - run: python -m pytest -q
      - name: Unified synthetic CLI and installed UI package
        run: |
          norisk-lab --database "$RUNNER_TEMP/lab.db" synthetic-demo > "$RUNNER_TEMP/synthetic.json"
          python -c 'import json,os; from pathlib import Path; r=json.loads((Path(os.environ["RUNNER_TEMP"])/"synthetic.json").read_text()); assert r["state"]=="SUCCEEDED"; assert all(c["parity_passed"] for c in r["result"]["candidates"])'
          python -m pip wheel --no-deps --no-build-isolation . -w "$RUNNER_TEMP/wheels"
          python -c 'import os,zipfile; from pathlib import Path; p=next((Path(os.environ["RUNNER_TEMP"])/"wheels").glob("*.whl")); assert "norisk_quant/lab_dashboard.html" in zipfile.ZipFile(p).namelist()'
  optional-pennylane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,quantum]"
      - run: python -m pytest -q tests/test_quantum_backends.py tests/test_quantum_selection.py
