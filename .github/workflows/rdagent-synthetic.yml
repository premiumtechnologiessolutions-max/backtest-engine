name: Native RD-Agent factor proposal
on:
  pull_request:
    paths:
      - '.github/workflows/rdagent-synthetic.yml'
      - 'scripts/rdagent_synthetic/**'
      - 'src/norisk_quant/**'
      - 'tests/test_lab_rdagent.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rdagent-synthetic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-rdagent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: microsoft/RD-Agent
          ref: 484776c211e4fbbeef03e0ec00d6bbee7362a4f4
          path: .rdagent-upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints-ci.txt -e ".[dev]"
      - name: Install the isolated native proposal imports
        run: |
          python -m venv "$RUNNER_TEMP/rdagent-runtime"
          "$RUNNER_TEMP/rdagent-runtime/bin/python" -m pip install -r scripts/rdagent_synthetic/requirements.txt
          echo "NRFX_RDAGENT_PYTHON=$RUNNER_TEMP/rdagent-runtime/bin/python" >> "$GITHUB_ENV"
          echo "NRFX_RDAGENT_CHECKOUT=$GITHUB_WORKSPACE/.rdagent-upstream" >> "$GITHUB_ENV"
      - name: Verify native hypothesis and task conversion with canonical synthetic parity
        run: NRFX_REQUIRE_RDAGENT=1 python -m pytest -q tests/test_lab_rdagent.py
