name: NoRiskFX - scientific negative-research registry
on:
  pull_request:
    paths:
      - 'src/norisk_quant/scientific_rejection_registry.py'
      - 'scripts/scientific_decision_registry.py'
      - 'tests/test_scientific_rejection_registry.py'
      - '.github/workflows/scientific-rejection-registry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-rejection:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned Python research dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Compile scientific decision source
        run: python -m compileall -q src/norisk_quant/scientific_rejection_registry.py scripts/scientific_decision_registry.py
      - name: Scientific rejection and canonical audit tests
        run: python -m pytest -q tests/test_scientific_rejection_registry.py tests/test_frozen_batch_attestation.py
  full-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Full canonical research regression
        run: python -m pytest -q
