name: NoRiskFX Unified Data Hub - metadata contracts
on:
  pull_request:
    paths:
      - 'src/norisk_quant/source_registry.py'
      - 'tests/test_unified_data_hub.py'
      - '.github/workflows/unified-data-hub.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install canonical dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Test Data Hub evidence and quote integrity
        run: |
          python -m compileall -q src/norisk_quant/source_registry.py
          python -m pytest -q tests/test_unified_data_hub.py tests/test_data_fingerprint.py tests/test_data_timestamp_unit_contract.py
      - name: Full canonical regression suite
        run: python -m pytest -q
