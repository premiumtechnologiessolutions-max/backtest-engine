name: NoRiskFX - independent frozen research evidence attestor
on:
  pull_request:
    paths:
      - 'src/norisk_quant/frozen_batch_attestation.py'
      - 'src/norisk_quant/report.py'
      - 'src/norisk_quant/canonical_research_worker.py'
      - 'scripts/verify_frozen_worker_evidence.py'
      - 'tests/test_frozen_batch_attestation.py'
      - 'tests/test_private_report_writer.py'
      - 'tests/test_canonical_research_worker.py'
      - '.github/workflows/frozen-research-attestation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attestor-and-ledger:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned research dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Compile independent evidence re-attestor
        run: python -m compileall -q src/norisk_quant/frozen_batch_attestation.py scripts/verify_frozen_worker_evidence.py src/norisk_quant/canonical_research_worker.py
      - name: Historical one-job evidence and queue policy tests
        run: python -m pytest -q tests/test_frozen_batch_attestation.py tests/test_private_report_writer.py tests/test_canonical_research_worker.py tests/test_research_control_plane.py
  canonical-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned research dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Full canonical historical research regressions
        run: python -m pytest -q
