name: NoRiskFX Terminal - read-only quote contract
on:
  pull_request:
    paths:
      - 'src/norisk_quant/integrations/**'
      - 'scripts/verify_terminal_intake.py'
      - 'tests/test_terminal_ticks_integration.py'
      - '.github/workflows/terminal-integration-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal-tick-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install canonical engine dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Verify integration contract and canonical tick normalizer
        run: |
          python -m compileall -q src/norisk_quant/integrations scripts/verify_terminal_intake.py
          python -m pytest -q tests/test_terminal_ticks_integration.py tests/test_data_timestamp_unit_contract.py
