name: Pinned TradingAgents graph
on:
  push:
    branches: [feat/unified-quantum-lab-20261105]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tradingagents-graph-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-fixture-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Install the pinned upstream source in a separate environment
        run: |
          python -m venv "$RUNNER_TEMP/tradingagents"
          "$RUNNER_TEMP/tradingagents/bin/python" -m pip install 'tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@9fa1196fffbcfd9de5146d2dd2869df84ab99838'
          printf 'NRFX_TRADINGAGENTS_PYTHON=%s/tradingagents/bin/python\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Execute all official graph stages without credentials or inference
        env:
          NRFX_REQUIRE_TRADINGAGENTS: '1'
        run: python -m pytest -q tests/test_lab_tradingagents.py
      - name: Verify unified durable dispatch
        run: |
          norisk-lab --database "$RUNNER_TEMP/tradingagents.db" tradingagents-demo > "$RUNNER_TEMP/tradingagents.json"
          python -c 'import json,os; from pathlib import Path; j=json.loads((Path(os.environ["RUNNER_TEMP"])/"tradingagents.json").read_text()); r=j["result"]; assert j["state"] == "SUCCEEDED" and r["official_graph_executed"] and not r["model_inference_executed"] and len(r["executed_nodes"]) == 9'
          norisk-lab --database "$RUNNER_TEMP/tradingagents.db" status > "$RUNNER_TEMP/tradingagents-status.json"
          python -c 'import json,os; from pathlib import Path; s=json.loads((Path(os.environ["RUNNER_TEMP"])/"tradingagents-status.json").read_text()); r=s["external_engines"]["tradingagents_graph_synthetic"]; assert r["fixture_execution_verified"] and not r["model_inference_verified"]'
