name: Native LEAN synthetic runtime
on:
  push:
    branches: [feat/unified-quantum-lab-20261105]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-synthetic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: QuantConnect/Lean
          ref: 9ecfed98339c27849a2a708edc03455caf151e91
          path: .lean-upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints-ci.txt -e ".[dev]"
      - name: Build the pinned native launcher and fixed algorithm
        run: |
          image=$(bash scripts/lean_synthetic/build.sh .lean-upstream)
          echo "NRFX_LEAN_RUNTIME_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Verify native order fills and closures in the offline fixture
        run: NRFX_REQUIRE_LEAN=1 python -m pytest -q tests/test_lab_lean.py
