name: NoRiskFX - private monthly source manifest
on:
  pull_request:
    paths:
      - 'src/norisk_quant/month_source_manifest.py'
      - 'scripts/prepare_gold_month_manifest.py'
      - 'tests/test_month_source_manifest.py'
      - '.github/workflows/private-month-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monthly-source-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install canonical pinned dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Compile source candidate builder
        run: python -m compileall -q src/norisk_quant/month_source_manifest.py scripts/prepare_gold_month_manifest.py
      - name: Test month source identity and B06 worker integration
        run: python -m pytest -q tests/test_month_source_manifest.py tests/test_research_source_preflight.py
  full-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install canonical pinned dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Full scientific regression
        run: python -m pytest -q
