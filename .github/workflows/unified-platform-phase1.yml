name: NoRiskFX - unified platform phase1 integration
on:
  pull_request:
    paths:
      - 'src/norisk_quant/unified_research_platform.py scripts/export_unified_platform_status.py'
      - 'src/norisk_quant/integrations/**'
      - 'src/norisk_quant/source_registry.py'
      - 'src/norisk_quant/research_control_plane.py'
      - 'src/norisk_quant/month_source_manifest.py'
      - 'tests/test_unified_platform_phase1.py'
      - 'tests/test_unified_platform_status_export.py'
      - 'scripts/export_unified_platform_status.py'
      - '.github/workflows/unified-platform-phase1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-stack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install canonical pinned dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Compile integrated platform source
        run: python -m compileall -q src/norisk_quant/integrations src/norisk_quant/unified_research_platform.py
      - name: Cross-project Terminal / Data Hub / Queue contracts
        run: python -m pytest -q tests/test_unified_platform_phase1.py tests/test_unified_platform_status_export.py tests/test_terminal_ticks_integration.py tests/test_unified_source_bridge.py tests/test_unified_data_hub.py tests/test_research_control_plane.py tests/test_month_source_manifest.py
  canonical-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install canonical pinned dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Full historical evidence and canonical regression
        run: python -m pytest -q
