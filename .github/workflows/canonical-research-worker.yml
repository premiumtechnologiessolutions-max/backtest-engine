name: NoRiskFX - canonical historical research worker
on:
  pull_request:
    paths:
      - 'src/norisk_quant/research_control_plane.py'
      - 'src/norisk_quant/canonical_research_worker.py'
      - 'scripts/canonical_research_worker.py'
      - 'tests/test_canonical_research_worker.py'
      - '.github/workflows/canonical-research-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned research dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Compile research worker and queue
        run: python -m compileall -q src/norisk_quant/research_control_plane.py src/norisk_quant/canonical_research_worker.py scripts/canonical_research_worker.py
      - name: Cross-platform worker and source-contract tests
        run: python -m pytest -q tests/test_canonical_research_worker.py tests/test_research_control_plane.py tests/test_research_source_preflight.py
      - name: POSIX-only canonical batch locks and private report permissions
        if: runner.os == 'Linux'
        run: python -m pytest -q tests/test_research_batch_orchestrator.py
  full-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned research dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Full suite with independent ledger audit gates
        run: python -m pytest -q
