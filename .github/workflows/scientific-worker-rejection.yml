name: NoRiskFX - rejected strategy cannot run
on:
  pull_request:
    paths:
      - 'src/norisk_quant/canonical_research_worker.py'
      - 'scripts/canonical_research_worker.py'
      - 'tests/test_scientific_worker_guard.py'
      - '.github/workflows/scientific-worker-rejection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  negative-evidence-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned research dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Scientific worker gate and history tests
        run: python -m pytest -q tests/test_scientific_worker_guard.py tests/test_scientific_rejection_registry.py tests/test_canonical_research_worker.py
  canonical-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned research dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Full canonical scientific and engine regressions
        run: python -m pytest -q
