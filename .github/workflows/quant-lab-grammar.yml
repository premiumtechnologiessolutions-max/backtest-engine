name: Quant Lab — causal formula regression
on:
  pull_request:
    paths:
      - 'src/norisk_quant/math_discovery.py'
      - 'tests/test_math_discovery.py'
      - 'scripts/run_arithmetic_research_cycles.py'
      - 'scripts/compile_arithmetic_training_feedback.py'
      - 'scripts/run_arithmetic_dispatch_training.py'
      - 'scripts/run_arithmetic_evolution.py'
      - 'tests/test_run_arithmetic_research_cycles.py'
      - '.github/workflows/quant-lab-grammar.yml'
  workflow_dispatch:
jobs:
  causal-formula-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Run math grammar, causality and execution parity tests
        run: python -m pytest -q tests/test_math_discovery.py tests/test_run_arithmetic_research_cycles.py
