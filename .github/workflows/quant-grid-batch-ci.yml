name: Quant Grid and Batch experimental checks

on:
  push:
    branches:
      - feat/quant-grid-batch-orchestrator
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grid-batch-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  batch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install constrained dependencies
        run: python -m pip install -c constraints-ci.txt -e ".[dev]"
      - name: Compile and run research batch/grid tests
        run: |
          python -m compileall -q scripts/research_batch.py scripts/research_grid.py tests/test_research_batch.py tests/test_research_grid.py
          python -m pytest -q tests/test_research_batch.py tests/test_research_grid.py
      - name: Run full project test suite
        run: python -m pytest -q

# Public-code tests only; do not upload any private XAUUSD archives.
