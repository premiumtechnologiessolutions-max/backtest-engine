name: Engine quality gates

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]" > install.log 2>&1 || { cat install.log; exit 1; }
      - name: Run unit tests
        run: |
          python -m pytest -q > pytest.log 2>&1 || { cat pytest.log; exit 1; }
          cat pytest.log
      - name: CLI smoke test
        run: norisk --help
      - name: Save CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-ci-diagnostics
          path: |
            install.log
            pytest.log
          if-no-files-found: ignore
