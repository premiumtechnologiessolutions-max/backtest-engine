name: Engine quality gates

# TEMPORARILY MANUAL-ONLY due to account-wide 2,000/2,000
# Actions minutes and 0.5/0.5 GB Actions storage exhausted.
# GitHub's official quota notice states reset on 2026-11-01.
# Avoid repeated startup failures/notification spam; restore the
# PR trigger only after quotas renew and an infrastructure probe passes.
#
# Intended restored trigger:
# pull_request:
#   paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/ci.yml"]
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the Python minor version of the audited 2026-10-25 local snapshot.
          python-version: "3.12"
      - name: Install project and constrained test dependencies
        run: python -m pip install -c constraints-ci.txt -e ".[dev]"
      - name: Record environment and check dependency compatibility
        run: |
          python --version
          python -m pip freeze
          python -m pip check
      - name: Compile all Python modules
        run: python -m compileall -q src tests scripts
      - name: Run the complete repository test suite
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          norisk --help
          norisk backtest --help
          norisk audit-gaps --help
# Do not upload redundant artifacts while Actions storage is exhausted.
