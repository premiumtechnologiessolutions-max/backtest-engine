name: Engine quality gates

# Exactly one run for a PR revision (not push + PR duplicate).
# workflow_dispatch remains available after monthly billing reset.
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run accounting, execution, data and gap tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          norisk --help
          norisk backtest --help
          norisk audit-gaps --help
# Do not upload redundant artifacts while Actions storage is exhausted.
