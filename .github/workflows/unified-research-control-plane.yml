name: NoRiskFX - AI Quant Lab research control plane
on:
  pull_request:
    paths:
      - 'src/norisk_quant/research_control_plane.py'
      - 'tests/test_research_control_plane.py'
      - 'tests/test_aiquantlab_import_cli.py'
      - 'scripts/import_aiquantlab_hypothesis.py'
      - '.github/workflows/unified-research-control-plane.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-queue-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned canonical quant dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Compile research-control module
        run: python -m compileall -q src/norisk_quant/research_control_plane.py scripts/import_aiquantlab_hypothesis.py
      - name: Run concurrency, restart, policy, no-trading tests
        run: python -m pytest -q tests/test_research_control_plane.py tests/test_aiquantlab_import_cli.py tests/test_registry.py
  full-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned canonical quant dependencies
        run: python -m pip install -c constraints-ci.txt -e '.[dev]'
      - name: Complete canonical research regression suite
        run: python -m pytest -q
