[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noriskfx-quant-engine"
version = "0.1.0"
description = "Auditable XAUUSD research backtesting engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8"]
nautilus = ["nautilus_trader==1.221.0"]
gpu = ["pyopencl>=2025.1,<2027"]
quantum = ["pennylane==0.43.0", "pennylane-lightning==0.43.0", "gast==0.6.0", "astunparse==1.6.3", "diastatic-malt==2.15.3"]

[project.scripts]
norisk = "norisk_quant.cli:main"
norisk-lab = "norisk_quant.lab_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
norisk_quant = ["lab_dashboard.html"]
"norisk_quant._agent_upstream" = ["*LICENSE.txt"]
