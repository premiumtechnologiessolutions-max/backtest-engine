[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noriskfx-quant-engine"
version = "0.1.0"
description = "Auditable XAUUSD research backtesting engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
norisk = "norisk_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
